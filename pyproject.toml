[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trapr"
version = "0.4.1"
description = "Plant traceable fingerprints in your open-source code and hunt for copies, with a CLI or an AI agent."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jayakrishna Ichapurapu" }]
keywords = ["watermark", "canary", "plagiarism", "attribution", "open-source", "license-compliance", "winnowing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
ast = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.6"]

[project.scripts]
trapr = "trapr:main"

[project.urls]
Homepage = "https://github.com/jaykrishna316/TrapR"
Issues = "https://github.com/jaykrishna316/TrapR/issues"

[tool.setuptools]
py-modules = ["trapr"]
