 <text x="320" y="70" font-size="20" font-weight="800" letter-spacing="4" fill="#f5c542">CODE PROVENANCE NOTICE</text>
 <text x="316" y="145" font-size="58" font-weight="900" letter-spacing=".2" fill="#fff">CODE <tspan fill="#f5c542">FINGERPRINTED</tspan></text>
 <text x="320" y="190" font-size="21" font-weight="700" letter-spacing=".7" fill="#e2e5e7">TRAPR TRACEABLE MARKERS &amp; BEHAVIORAL CANARIES</text>
