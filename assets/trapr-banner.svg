<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">TrapR code fingerprinted repository notice</title>
<desc id="desc">A caution-style repository badge. TrapR plants traceable code fingerprints and behavioral canaries; copying may leave verifiable evidence. GitHub repository: github.com/jaykrishna316/TrapR.</desc>
<defs>
