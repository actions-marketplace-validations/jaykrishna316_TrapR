 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect x="10" y="10" width="1180" height="300" rx="28" fill="#111315" stroke="#f5c542" stroke-width="8" filter="url(#shadow)"/>
<rect x="25" y="25" width="14" height="270" rx="6" fill="url(#hazard)"/>
