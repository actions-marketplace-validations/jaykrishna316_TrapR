name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        ast: ["stdlib", "tree-sitter"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install optional AST support
        if: matrix.ast == 'tree-sitter'
        run: pip install ".[ast]"
      - name: Tests
        run: python tests/test_trapr.py
      - name: Package installs and runs
        run: |
          pip install .
          trapr --version
