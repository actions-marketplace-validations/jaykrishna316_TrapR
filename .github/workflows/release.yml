# Push a tag like v0.4.1 to publish:
#  - a GitHub release with trapr.py and its SHA-256 (for the curl install path)
#  - the package on PyPI (trusted publishing: add this repo as a publisher on pypi.org first)
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check version matches tag
        run: |
          v=$(python trapr.py --version)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "::error::trapr.py says $v but tag is ${GITHUB_REF_NAME}"; exit 1; }
      - name: Test
        run: python tests/test_trapr.py && python tests/test_similarity.py
      - name: Build
        run: |
          pip install build
          python -m build
          sha256sum trapr.py > SHA256SUMS
          cat SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" trapr.py SHA256SUMS dist/* \
            --title "$GITHUB_REF_NAME" --notes-file <(sed -n "/^## ${GITHUB_REF_NAME#v}/,/^## /p" CHANGELOG.md | sed '$d')
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
