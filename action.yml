name: "TrapR hunt"
description: "Search GitHub for copies of your code using TrapR vaults, and open an issue when evidence turns up."
author: "Jayakrishna Ichapurapu"
branding:
  icon: "search"
  color: "orange"

inputs:
  vaults:
    description: "Glob of vault files to hunt with. Run this action ONLY in a PRIVATE repository."
    default: "vaults/*.trapr-vault.md"
  search-token:
    description: "Token used for GitHub code search: a fine-grained PAT with public read access (code search needs a user token)."
    required: true
  sources:
    description: "Where to look, comma-separated: code, forks, pypi, npm."
    default: "code,forks,pypi,npm"
  max-queries:
    description: "Maximum search queries per vault (code search allows about 10 per minute)."
    default: "40"
  open-issue:
    description: "Open an issue in this (private) repo when definitive or strong evidence is found."
    default: "true"
  report-issue:
    description: "Title of one issue that gets a comment after every run, all clear or not, with a row per project. GitHub emails each comment to people watching the repo. Set to empty to turn off."
    default: "TrapR weekly hunt"
  python-version:
    description: "Python version to use."
    default: "3.12"

outputs:
  definitive:
    description: "Total definitive findings across all vaults."
    value: ${{ steps.hunt.outputs.definitive }}
  strong:
    description: "Total strong findings across all vaults."
    value: ${{ steps.hunt.outputs.strong }}

runs:
  using: "composite"
  steps:
    - name: Refuse to run in a public repository
      shell: bash
      env:
        VISIBILITY: ${{ github.event.repository.visibility }}
      run: |
        if [ "$VISIBILITY" = "public" ]; then
          echo "::error::TrapR vaults hold secret keys. Run this action only in a PRIVATE repository."
          exit 1
        fi

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install optional AST support
      shell: bash
      run: pip install --quiet "tree-sitter>=0.23" "tree-sitter-language-pack>=0.6" || true

    - name: Hunt
      id: hunt
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.search-token }}
        VAULTS: ${{ inputs.vaults }}
        MAX_QUERIES: ${{ inputs.max-queries }}
        SOURCES: ${{ inputs.sources }}
        TOOL: ${{ github.action_path }}/trapr.py
      run: |
        shopt -s nullglob
        mkdir -p trapr-reports
        files=( $VAULTS )
        if [ ${#files[@]} -eq 0 ]; then echo "::error::No vaults match '$VAULTS'"; exit 1; fi
        d=0; s=0
        : > trapr-reports/summary.tsv
        for v in "${files[@]}"; do
          name=$(basename "$v" .trapr-vault.md)
          echo "::group::Hunting with $name"
          python3 "$TOOL" hunt --vault "$v" --sources "$SOURCES" --max-queries "$MAX_QUERIES" --report "trapr-reports/$name.md" || true
          echo "::endgroup::"
          if [ -f "trapr-reports/$name.md" ]; then
            line=$(grep -m1 '^- Findings:' "trapr-reports/$name.md" || true)
            vd=$(echo "$line" | sed -nE 's/.*: ([0-9]+) definitive.*/\1/p' | grep . || echo 0)
            vs=$(echo "$line" | sed -nE 's/.* ([0-9]+) strong.*/\1/p' | grep . || echo 0)
            d=$(( d + vd )); s=$(( s + vs ))
            printf '%s\t%s\t%s\tok\n' "$name" "$vd" "$vs" >> trapr-reports/summary.tsv
          else
            printf '%s\t-\t-\tno report\n' "$name" >> trapr-reports/summary.tsv
          fi
        done
        echo "definitive=$d" >> "$GITHUB_OUTPUT"
        echo "strong=$s" >> "$GITHUB_OUTPUT"
        {
          echo "## trapr hunt"
          echo "- Definitive: **$d** · Strong: **$s**"
          echo
          echo "| Project | Definitive | Strong | Status |"
          echo "|---|---|---|---|"
          awk -F'\t' '{printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4}' trapr-reports/summary.tsv
          echo
          for r in trapr-reports/*.md; do echo "### $(basename "$r" .md)"; sed -n '1,40p' "$r"; done
        } >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v7
      with:
        name: trapr-reports
        path: trapr-reports/

    - name: Open an issue
      if: ${{ inputs.open-issue == 'true' && (steps.hunt.outputs.definitive != '0' || steps.hunt.outputs.strong != '0') }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        D: ${{ steps.hunt.outputs.definitive }}
        S: ${{ steps.hunt.outputs.strong }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        # GitHub caps an issue body at 65,536 characters: lead with the table, keep each project's
        # report short, and point to the run's artifact for the full reports.
        {
          echo "**$D definitive, $S strong** finding(s)."
          echo
          echo "| Project | Definitive | Strong | Status |"
          echo "|---|---|---|---|"
          awk -F'\t' '{printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4}' trapr-reports/summary.tsv
          echo
          echo "Full reports: download the **trapr-reports** artifact from $RUN_URL"
          echo
          for r in trapr-reports/*.md; do
            [ -f "$r" ] || continue
            echo "<details><summary>$(basename "$r" .md)</summary>"
            echo
            sed -n '1,120p' "$r"
            echo
            echo "</details>"
          done
        } > body-full.md
        if [ "$(wc -c < body-full.md)" -gt 60000 ]; then
          head -c 60000 body-full.md > body.md
          printf '\n\n</details>\n\n…truncated. Full reports: the **trapr-reports** artifact at %s\n' "$RUN_URL" >> body.md
        else
          mv body-full.md body.md
        fi
        gh issue create --title "TrapR: $D definitive, $S strong finding(s) ($(date +%F))" --body-file body.md

    - name: Post the run report
      if: ${{ always() && inputs.report-issue != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TITLE: ${{ inputs.report-issue }}
        D: ${{ steps.hunt.outputs.definitive }}
        S: ${{ steps.hunt.outputs.strong }}
        OUTCOME: ${{ steps.hunt.outcome }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        n=$(gh issue list --state open --limit 200 --json number,title --jq '.[] | select(.title==env.TITLE) | .number' | head -1)
        if [ -z "$n" ]; then
          n=$(gh issue create --title "$TITLE" --body "TrapR posts the result of every hunt here, one row per project. Watch this repository to get each one by email." | grep -oE '[0-9]+$')
        fi
        if [ "$OUTCOME" != "success" ]; then verdict="⚠️ The hunt didn't finish ($OUTCOME). Check the run."
        elif [ "${D:-0}" = "0" ] && [ "${S:-0}" = "0" ]; then verdict="✅ All clear: no copies found."
        else verdict="🚨 ${D:-0} definitive and ${S:-0} strong finding(s). A separate issue has the details."; fi
        {
          echo "$verdict"
          echo
          echo "| Project | Definitive | Strong | Status |"
          echo "|---|---|---|---|"
          if [ -s trapr-reports/summary.tsv ]; then
            awk -F'\t' '{printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4}' trapr-reports/summary.tsv
          fi
          echo
          for r in trapr-reports/*.md; do
            [ -f "$r" ] || continue
            echo "<details><summary>$(basename "$r" .md) report</summary>"
            echo
            sed -n '1,60p' "$r"
            echo
            echo "</details>"
          done
          echo
          echo "Run, logs and full reports: $RUN_URL"
        } | head -c 60000 > trapr-comment.md
        gh issue comment "$n" --body-file trapr-comment.md
